name: Windows Driver Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WDK & SDK NuGet packages
        run: |
          nuget restore windows\packages.config -PackagesDirectory windows\packages

      - name: Add WDK Tools to PATH
        shell: pwsh
        run: |
          $tools = Get-ChildItem -Path "windows\packages", "C:\Program Files (x86)\Windows Kits\10" -Filter "stampinf.exe" -Recurse -ErrorAction SilentlyContinue
          foreach ($tool in $tools) {
            $dir = $tool.DirectoryName
            Write-Host "Adding WDK tools directory to PATH: $dir"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Driver (Unsigned)
        run: |
          msbuild windows\sys\kbfiltr.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:VisualStudioVersion=17.0

      - name: Build Test App
        run: |
          msbuild windows\exe\kbftest.vcxproj /p:Configuration=Release /p:Platform=x64 /p:VisualStudioVersion=17.0

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-driver-x64
          path: |
            windows/sys/x64/Release/kbfiltr.sys
            windows/sys/x64/Release/kbfiltr.inf
            windows/exe/x64/Release/kbftest.exe
