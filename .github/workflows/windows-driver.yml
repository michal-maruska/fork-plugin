name: Windows Driver Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsWDK --accept-package-agreements --accept-source-agreements --disable-interactivity
          $vsixPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Vsix" -Filter "WDK.vsix" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($vsixPath) {
            Write-Host "Installing WDK VSIX extension from $vsixPath..."
            & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\VSIXInstaller.exe" /quiet /admin $vsixPath
          } else {
            Write-Host "WDK VSIX extension not found."
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Driver (Unsigned)
        run: |
          msbuild windows\sys\kbfiltr.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off

      - name: Build Test App
        run: |
          msbuild windows\exe\kbftest.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-driver-x64
          path: |
            windows/sys/x64/Release/kbfiltr.sys
            windows/sys/x64/Release/kbfiltr.inf
            windows/exe/x64/Release/kbftest.exe
